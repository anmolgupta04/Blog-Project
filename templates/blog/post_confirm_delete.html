{% extends "base.html" %}

{% block title %}Delete Post | StoryBoard{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <section class="detail-card shadow-sm p-4 p-lg-5 border border-danger-subtle">
        <span class="eyebrow text-danger">Danger zone</span>
        <h1 class="section-title mt-2">Delete "{{ post.title }}"?</h1>
        <p class="text-muted">
          This action permanently removes the post and its comments from the database.
        </p>

        <form method="post">
          {% csrf_token %}
          <div class="d-flex flex-wrap gap-3">
            <button type="submit" class="btn btn-danger">Yes, delete it</button>
            <a href="{% url 'post_detail' post.slug %}" class="btn btn-outline-dark">Cancel</a>
          </div>
        </form>
      </section>
    </div>
  </div>
{% endblock %}
